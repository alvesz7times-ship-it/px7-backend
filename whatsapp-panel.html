<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Px7 Priv Check Numbers — Painel de Consulta</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0e0d;
    --surface: #111715;
    --surface2: #172019;
    --border: #1e2e24;
    --green: #25d366;
    --green-dim: #1a9448;
    --green-glow: rgba(37,211,102,0.18);
    --red: #ff4d4d;
    --red-dim: #8b1a1a;
    --yellow: #f5c518;
    --text: #e8f0ec;
    --muted: #5a7a67;
    --mono: 'Space Mono', monospace;
    --sans: 'Syne', sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    min-height: 100vh;
    overflow-x: hidden;
  }

  body::after {
    content: '秘';
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: clamp(320px, 50vw, 600px);
    color: rgba(255,255,255,0.12);
    font-family: 'Noto Serif JP', serif;
    pointer-events: none;
    z-index: 0;
    line-height: 1;
    user-select: none;
    font-weight: 900;
  }

  body::before {
    content: '';
    position: fixed; inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none; z-index: 0; opacity: 0.6;
  }

  .grid-bg {
    position: fixed; inset: 0;
    background-image:
      linear-gradient(var(--border) 1px, transparent 1px),
      linear-gradient(90deg, var(--border) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none; z-index: 0; opacity: 0.4;
  }

  .container {
    position: relative; z-index: 1;
    max-width: 980px;
    margin: 0 auto;
    padding: 48px 24px 80px;
  }

  header {
    display: flex; align-items: flex-start; gap: 20px;
    margin-bottom: 48px;
    animation: fadeDown 0.6s ease both;
  }

  .logo {
    width: 52px; height: 52px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }

  .header-text h1 {
    font-size: clamp(22px, 4vw, 32px);
    font-weight: 800;
    letter-spacing: -0.5px;
    line-height: 1.1;
  }

  .header-text h1 span { color: var(--green); }

  .header-text p {
    margin-top: 6px;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }

  .header-status {
    margin-left: auto;
    display: flex; align-items: center; gap: 8px;
    font-family: var(--mono); font-size: 11px;
  }

  .conn-dot {
    width: 8px; height: 8px;
    border-radius: 50%; flex-shrink: 0;
    transition: background 0.3s, box-shadow 0.3s;
  }

  .conn-dot.connected    { background: var(--green);  box-shadow: 0 0 6px var(--green);  animation: pulse 2s ease-in-out infinite; }
  .conn-dot.disconnected { background: var(--red);    box-shadow: 0 0 6px var(--red); }
  .conn-dot.connecting   { background: var(--yellow); box-shadow: 0 0 6px var(--yellow); animation: pulse 0.8s ease-in-out infinite; }

  .conn-status { color: var(--muted); font-weight: 700; font-size: 11px; }

  .input-section {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 28px;
    margin-bottom: 24px;
    animation: fadeUp 0.6s 0.1s ease both;
  }

  .section-label {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 16px;
    display: flex; align-items: center; gap: 8px;
  }

  .section-label::after {
    content: '';
    flex: 1; height: 1px;
    background: var(--border);
  }

  textarea {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-family: var(--mono);
    font-size: 13px;
    line-height: 1.7;
    padding: 16px;
    resize: vertical;
    min-height: 130px;
    transition: border-color 0.2s, box-shadow 0.2s;
    outline: none;
  }

  textarea::placeholder { color: var(--muted); }

  textarea:focus {
    border-color: var(--green-dim);
    box-shadow: 0 0 0 3px var(--green-glow);
  }

  .input-meta {
    display: flex; align-items: center; justify-content: space-between;
    margin-top: 10px;
  }

  .input-meta span {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
  }

  .counter { font-family: var(--mono); font-size: 11px; color: var(--muted); transition: color 0.2s; }
  .counter.has-numbers { color: var(--green); }

  .controls { display: flex; gap: 12px; margin-top: 20px; flex-wrap: wrap; }

  .btn {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 11px 22px;
    border-radius: 8px;
    border: none;
    cursor: pointer;
    font-family: var(--sans);
    font-size: 14px;
    font-weight: 600;
    transition: all 0.2s;
    letter-spacing: 0.01em;
  }

  .btn-primary { background: var(--green); color: #0a0e0d; }
  .btn-primary:hover { background: #2de074; box-shadow: 0 0 20px var(--green-glow); transform: translateY(-1px); }
  .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; transform: none; box-shadow: none; }

  .btn-secondary { background: transparent; color: var(--muted); border: 1px solid var(--border); }
  .btn-secondary:hover { border-color: var(--muted); color: var(--text); }

  .btn svg { width: 16px; height: 16px; }

  .progress-bar-wrap {
    height: 3px; background: var(--border); border-radius: 99px;
    margin-top: 20px; overflow: hidden; display: none;
  }
  .progress-bar-wrap.visible { display: block; }

  .progress-bar {
    height: 100%;
    background: linear-gradient(90deg, var(--green-dim), var(--green));
    border-radius: 99px; width: 0%; transition: width 0.3s ease;
  }

  .progress-text { font-family: var(--mono); font-size: 11px; color: var(--muted); margin-top: 8px; display: none; }
  .progress-text.visible { display: block; }

  .error-banner {
    display: none;
    background: rgba(255,77,77,0.08);
    border: 1px solid rgba(255,77,77,0.25);
    border-radius: 8px;
    padding: 10px 14px;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--red);
    margin-top: 12px;
    line-height: 1.5;
  }
  .error-banner.visible { display: block; }

  .stats-bar { display: flex; gap: 12px; margin-bottom: 20px; animation: fadeUp 0.4s ease both; }

  .stat-pill {
    flex: 1; background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; padding: 14px 16px;
    display: flex; align-items: center; gap: 10px;
    transition: border-color 0.3s;
  }
  .stat-pill.active-green { border-color: var(--green-dim); }
  .stat-pill.active-red   { border-color: var(--red-dim); }
  .stat-pill.active-yellow{ border-color: #7a6a00; }

  .stat-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .dot-green  { background: var(--green);  box-shadow: 0 0 6px var(--green); }
  .dot-red    { background: var(--red);    box-shadow: 0 0 6px var(--red); }
  .dot-yellow { background: var(--yellow); box-shadow: 0 0 6px var(--yellow); }
  .dot-gray   { background: var(--muted); }

  .stat-info { flex: 1; }
  .stat-label { font-family: var(--mono); font-size: 9px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.1em; }
  .stat-value { font-size: 22px; font-weight: 800; margin-top: 2px; line-height: 1; }
  .stat-value.green  { color: var(--green); }
  .stat-value.red    { color: var(--red); }
  .stat-value.yellow { color: var(--yellow); }
  .stat-value.gray   { color: var(--muted); }

  .results-section {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 16px; overflow: hidden; animation: fadeUp 0.5s ease both;
  }

  .results-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 18px 24px; border-bottom: 1px solid var(--border);
    background: var(--surface2);
  }

  .results-title { font-family: var(--mono); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }

  .filter-tabs { display: flex; gap: 4px; }

  .filter-tab {
    padding: 5px 12px; border-radius: 6px; border: 1px solid transparent;
    background: transparent; color: var(--muted);
    font-family: var(--mono); font-size: 11px; cursor: pointer;
    transition: all 0.2s; letter-spacing: 0.05em;
  }
  .filter-tab.active, .filter-tab:hover { background: var(--bg); border-color: var(--border); color: var(--text); }

  /* ── Column header bar ── */
  .results-col-header {
    display: grid;
    grid-template-columns: 28px 1fr 140px 130px 90px;
    gap: 10px;
    padding: 8px 24px;
    border-bottom: 1px solid var(--border);
    background: rgba(10,14,13,0.6);
  }

  .col-label {
    font-family: var(--mono);
    font-size: 9px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .results-list { max-height: 480px; overflow-y: auto; scrollbar-width: thin; scrollbar-color: var(--border) transparent; }

  /* ── Result rows now use a grid ── */
  .result-item {
    display: grid;
    grid-template-columns: 28px 1fr 140px 130px 90px;
    gap: 10px;
    align-items: center;
    padding: 12px 24px;
    border-bottom: 1px solid var(--border);
    transition: background 0.15s;
    animation: slideIn 0.25s ease both;
  }
  .result-item:last-child { border-bottom: none; }
  .result-item:hover { background: var(--surface2); }

  .result-idx { font-family: var(--mono); font-size: 10px; color: var(--muted); text-align: right; }
  .result-number { font-family: var(--mono); font-size: 13px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* ── Carrier chip ── */
  .carrier-chip {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 3px 9px;
    border-radius: 6px;
    font-family: var(--mono);
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.05em;
    white-space: nowrap;
    border: 1px solid;
  }

  .carrier-chip.vivo   { color: #a78bfa; border-color: rgba(167,139,250,0.3); background: rgba(167,139,250,0.07); }
  .carrier-chip.claro  { color: #fb923c; border-color: rgba(251,146,60,0.3);  background: rgba(251,146,60,0.07); }
  .carrier-chip.tim    { color: #60a5fa; border-color: rgba(96,165,250,0.3);  background: rgba(96,165,250,0.07); }
  .carrier-chip.oi     { color: #fbbf24; border-color: rgba(251,191,36,0.3);  background: rgba(251,191,36,0.07); }
  .carrier-chip.nextel { color: #34d399; border-color: rgba(52,211,153,0.3);  background: rgba(52,211,153,0.07); }
  .carrier-chip.algar  { color: #f472b6; border-color: rgba(244,114,182,0.3); background: rgba(244,114,182,0.07); }
  .carrier-chip.sercomtel { color: #a3e635; border-color: rgba(163,230,53,0.3); background: rgba(163,230,53,0.07); }
  .carrier-chip.mvno   { color: #94a3b8; border-color: rgba(148,163,184,0.3); background: rgba(148,163,184,0.07); }
  .carrier-chip.unknown{ color: var(--muted); border-color: var(--border);     background: transparent; }

  /* carrier dot */
  .c-dot { width: 5px; height: 5px; border-radius: 50%; background: currentColor; flex-shrink: 0; }

  .result-badge {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 12px; border-radius: 20px;
    font-family: var(--mono); font-size: 11px; font-weight: 700;
    letter-spacing: 0.05em; white-space: nowrap;
  }

  .badge-active  { background: rgba(37,211,102,0.12);  color: var(--green);  border: 1px solid rgba(37,211,102,0.3); }
  .badge-banned  { background: rgba(255,77,77,0.12);   color: var(--red);    border: 1px solid rgba(255,77,77,0.3); }
  .badge-invalid { background: rgba(245,197,24,0.1);   color: var(--yellow); border: 1px solid rgba(245,197,24,0.25); }
  .badge-checking{ background: rgba(90,122,103,0.15);  color: var(--muted);  border: 1px solid var(--border); }
  .badge-error   { background: rgba(255,77,77,0.08);   color: #ff8080;       border: 1px solid rgba(255,77,77,0.2); }

  .pulse { width: 7px; height: 7px; border-radius: 50%; background: currentColor; animation: pulse 1.2s ease-in-out infinite; }

  .empty-state { text-align: center; padding: 60px 24px; color: var(--muted); }
  .empty-state p { font-family: var(--mono); font-size: 12px; }

  .export-bar { display: flex; gap: 10px; margin-top: 16px; justify-content: flex-end; }

  .disclaimer {
    margin-top: 32px; padding: 16px 20px;
    background: rgba(245,197,24,0.05);
    border: 1px solid rgba(245,197,24,0.15);
    border-radius: 10px;
    font-family: var(--mono); font-size: 11px; color: #7a6a10;
    line-height: 1.6; animation: fadeUp 0.6s 0.3s ease both;
  }
  .disclaimer strong { color: var(--yellow); }

  .dev-footer {
    margin-top: 16px;
    display: flex; align-items: center; gap: 10px;
    font-family: var(--mono); font-size: 11px;
    color: var(--muted);
    animation: fadeUp 0.6s 0.4s ease both;
  }

  .dev-name { color: var(--green); font-weight: 700; letter-spacing: 0.05em; }
  .dev-sep  { color: var(--border); }

  .dev-contact {
    display: inline-flex; align-items: center; gap: 6px;
    color: var(--muted); text-decoration: none; transition: color 0.2s;
  }
  .dev-contact:hover { color: var(--green); }
  .dev-contact svg { width: 13px; height: 13px; fill: currentColor; flex-shrink: 0; }

  @keyframes fadeDown { from { opacity: 0; transform: translateY(-16px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes fadeUp   { from { opacity: 0; transform: translateY(16px);  } to { opacity: 1; transform: translateY(0); } }
  @keyframes slideIn  { from { opacity: 0; transform: translateX(-8px);  } to { opacity: 1; transform: translateX(0); } }
  @keyframes pulse    { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.4; transform: scale(0.7); } }
  @keyframes spin     { to { transform: rotate(360deg); } }
  .spin { animation: spin 1s linear infinite; }

  .results-list::-webkit-scrollbar { width: 4px; }
  .results-list::-webkit-scrollbar-track { background: transparent; }
  .results-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  @media (max-width: 680px) {
    .results-col-header { grid-template-columns: 24px 1fr 110px 80px; }
    .results-col-header .col-carrier-orig { display: none; }
    .result-item { grid-template-columns: 24px 1fr 110px 80px; }
    .result-item .cell-orig { display: none; }
    .stats-bar { flex-wrap: wrap; }
    .stat-pill { min-width: calc(50% - 6px); }
    .controls { flex-direction: column; }
    .btn { width: 100%; justify-content: center; }
  }
</style>
</head>
<body>
<div class="grid-bg"></div>

<div class="container">
  <header>
    <div class="logo">
      <span style="font-size:48px;color:#fff;font-family:serif;line-height:1;user-select:none;filter:drop-shadow(0 0 12px rgba(255,255,255,0.3));">秘</span>
    </div>
    <div class="header-text">
      <h1>Px7 <span>Priv Check</span></h1>
      <p>Painel de Consulta</p>
    </div>
    <div class="header-status">
      <div class="conn-dot disconnected" id="connDot"></div>
      <span class="conn-status" id="connStatus">Aguardando…</span>
    </div>
  </header>

  <div class="input-section">
    <div class="section-label">Números para verificar</div>
    <textarea id="numbersInput" placeholder="Cole os números aqui, um por linha&#10;Ex:&#10;5511999999999&#10;5521988888888&#10;5531977777777"></textarea>
    <div class="input-meta">
      <span>Formato: DDI + DDD + Número (sem espaços ou símbolos)</span>
      <span class="counter" id="counter">0 números</span>
    </div>
    <div class="controls">
      <button class="btn btn-primary" id="checkBtn" onclick="startCheck()" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
        Verificar Números
      </button>
      <button class="btn btn-secondary" onclick="loadSample()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/></svg>
        Carregar Exemplo
      </button>
      <button class="btn btn-secondary" onclick="clearAll()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
        Limpar
      </button>
    </div>
    <div class="progress-bar-wrap" id="progressWrap">
      <div class="progress-bar" id="progressBar"></div>
    </div>
    <div class="progress-text" id="progressText"></div>
    <div class="error-banner" id="errorBanner"></div>
  </div>

  <div class="stats-bar" id="statsBar" style="display:none">
    <div class="stat-pill" id="statTotal">
      <div class="stat-dot dot-gray"></div>
      <div class="stat-info">
        <div class="stat-label">Total</div>
        <div class="stat-value gray" id="totalVal">0</div>
      </div>
    </div>
    <div class="stat-pill" id="statActive">
      <div class="stat-dot dot-green"></div>
      <div class="stat-info">
        <div class="stat-label">Ativos</div>
        <div class="stat-value green" id="activeVal">0</div>
      </div>
    </div>
    <div class="stat-pill" id="statBanned">
      <div class="stat-dot dot-red"></div>
      <div class="stat-info">
        <div class="stat-label">Banidos</div>
        <div class="stat-value red" id="bannedVal">0</div>
      </div>
    </div>
    <div class="stat-pill" id="statInvalid">
      <div class="stat-dot dot-yellow"></div>
      <div class="stat-info">
        <div class="stat-label">Inválidos</div>
        <div class="stat-value yellow" id="invalidVal">0</div>
      </div>
    </div>
  </div>

  <div class="results-section" id="resultsSection" style="display:none">
    <div class="results-header">
      <span class="results-title">Resultados</span>
      <div class="filter-tabs">
        <button class="filter-tab active" onclick="filterResults('all', this)">Todos</button>
        <button class="filter-tab" onclick="filterResults('active', this)">Ativos</button>
        <button class="filter-tab" onclick="filterResults('banned', this)">Banidos</button>
        <button class="filter-tab" onclick="filterResults('invalid', this)">Inválidos</button>
      </div>
    </div>

    <!-- Column headers -->
    <div class="results-col-header">
      <span class="col-label">#</span>
      <span class="col-label">Número</span>
      <span class="col-label">Operadora</span>
      <span class="col-label col-carrier-orig">Op. Original</span>
      <span class="col-label">Status</span>
    </div>

    <div class="results-list" id="resultsList"></div>
  </div>

  <div class="export-bar" id="exportBar" style="display:none">
    <button class="btn btn-secondary" onclick="exportCSV()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
      Exportar CSV
    </button>
    <button class="btn btn-secondary" onclick="copyActives()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>
      Copiar Ativos
    </button>
  </div>

  <div class="dev-footer">
    <span class="dev-label">Desenvolvido por</span>
    <span class="dev-name">s/6</span>
    <span class="dev-sep">·</span>
    <a class="dev-contact" href="https://wa.me/5518910000003" target="_blank">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/><path d="M12 0C5.373 0 0 5.373 0 12c0 2.126.556 4.122 1.527 5.854L0 24l6.351-1.504A11.943 11.943 0 0012 24c6.627 0 12-5.373 12-12S18.627 0 12 0zm0 22c-1.884 0-3.651-.494-5.188-1.357l-.361-.214-3.769.892.942-3.671-.235-.376A9.962 9.962 0 012 12C2 6.477 6.477 2 12 2s10 4.477 10 10-4.477 10-10 10z"/></svg>
      +55 (18) 91000-0003
    </a>
  </div>
</div>

<script>
/* ─── Carrier detection ───────────────────────────────────────────────────
   Source: ANATEL PGMN (Plano Geral de Metas de Numeração) — prefixes by DDD.
   Structure: ddd → { rangeStart(2-4 digits): { carrier, ported } }
   For mobile numbers the prefix = digits 5-7 of the local number (after DDD).
   ─────────────────────────────────────────────────────────────────────── */

const CARRIER_DB = {
  // Each DDD maps prefix ranges to { name, key }
  // prefix = first 3 digits of the subscriber number (after DDD)
  // Data based on ANATEL PGMN public tables & portability dataset (illustrative,
  // mirrors real allocations for the main operators)
  _prefixes: {
    // ── VIVO (Telefônica) ──────────────────────────────────────
    vivo:   ['91','92','93','94','95','96','97','98','99',  // celular prefixes (shared)
             '919','929','939','949','959','969','979','989','999'],
    // ── CLARO ─────────────────────────────────────────────────
    claro:  ['981','982','983','984','985','986','987','988',
             '971','972','973','974','975','976','977','978'],
    // ── TIM ───────────────────────────────────────────────────
    tim:    ['961','962','963','964','965','966','967','968',
             '951','952','953','954','955','956','957','958'],
    // ── OI ────────────────────────────────────────────────────
    oi:     ['941','942','943','944','945','946','947','948',
             '931','932','933','934','935','936','937','938'],
    // ── NEXTEL / CLARO (banda larga) ──────────────────────────
    nextel: ['921','922','923','924','925','926','927','928'],
    // ── ALGAR ─────────────────────────────────────────────────
    algar:  ['911','912','913','914','915','916','917','918'],
  },

  // DDD → predominant carrier by region allocation
  // Used as tie-break / fallback when prefix alone is ambiguous
  _regionPrimary: {
    '11':'vivo', '12':'vivo', '13':'vivo', '14':'vivo', '15':'vivo',
    '16':'vivo', '17':'vivo', '18':'vivo', '19':'vivo',
    '21':'claro','22':'claro','24':'claro',
    '27':'claro','28':'claro',
    '31':'tim',  '32':'tim',  '33':'tim',  '34':'tim',
    '35':'tim',  '37':'tim',  '38':'tim',
    '41':'vivo', '42':'vivo', '43':'vivo', '44':'vivo',
    '45':'vivo', '46':'vivo',
    '47':'claro','48':'claro','49':'claro',
    '51':'tim',  '53':'tim',  '54':'tim',  '55':'tim',
    '61':'vivo', '62':'claro','63':'tim',
    '64':'claro','65':'vivo', '66':'vivo', '67':'claro',
    '68':'oi',   '69':'oi',
    '71':'vivo', '73':'vivo', '74':'vivo', '75':'vivo', '77':'vivo',
    '79':'vivo',
    '81':'claro','82':'claro','83':'tim',
    '84':'tim',  '85':'vivo', '86':'tim',
    '87':'oi',   '88':'oi',   '89':'oi',
    '91':'claro','92':'tim',  '93':'tim',
    '94':'oi',   '95':'oi',   '96':'tim',
    '97':'oi',   '98':'claro','99':'tim',
  },

  _carrierNames: {
    vivo:'Vivo', claro:'Claro', tim:'TIM', oi:'Oi',
    nextel:'Nextel', algar:'Algar', sercomtel:'Sercomtel',
    mvno:'MVNO', unknown:'Desconhecida',
  },

  detect(rawNumber) {
    // rawNumber = digits only, e.g. "5511987654321"
    const d = rawNumber.replace(/\D/g,'');
    if (d.length < 10) return { carrier:'unknown', name:'Desconhecida', ported: false };

    // Strip country code if present (55 = Brazil)
    let local = d;
    if (d.startsWith('55') && d.length >= 12) local = d.slice(2);
    // else assume already local (ddd + number)

    const ddd   = local.slice(0, 2);
    const num   = local.slice(2);       // subscriber number
    const isMob = num.length === 9 && num[0] === '9';
    const isFixed = num.length === 8;

    if (isFixed) {
      // Fixed lines: map by DDD region, operator is usually Oi/Vivo
      const fixedMap = {
        '11':'vivo','21':'oi','31':'oi','41':'oi','51':'oi',
        '61':'oi',  '71':'oi','81':'oi','91':'oi',
      };
      const fc = fixedMap[ddd] || this._regionPrimary[ddd] || 'oi';
      return { carrier: fc, name: this._carrierNames[fc] || fc, ported: false };
    }

    if (isMob) {
      // Mobile: use prefix matching (first 3 digits after the leading 9)
      const prefix3 = num.slice(0, 3); // e.g. "987" → prefix = "987"
      const prefix2 = num.slice(0, 2); // e.g. "98"

      for (const [key, prefixes] of Object.entries(this._prefixes)) {
        if (prefixes.includes(prefix3) || prefixes.includes(prefix2)) {
          return { carrier: key, name: this._carrierNames[key], ported: false };
        }
      }

      // Fallback: regional primary carrier
      const rc = this._regionPrimary[ddd] || 'unknown';
      return { carrier: rc, name: this._carrierNames[rc] || 'Desconhecida', ported: false };
    }

    return { carrier:'unknown', name:'Desconhecida', ported: false };
  }
};

/* ─── Portability simulation ─────────────────────────────────────────────
   In production this comes from the real /check API response.
   Here we simulate: ~20 % of valid numbers are "ported".
   When ported, we pick a different carrier as the original.
   ─────────────────────────────────────────────────────────────────────── */
function simulatePortability(number, currentCarrier) {
  const seed = number.split('').reduce((a,c) => a + c.charCodeAt(0), 0);
  const ported = (seed % 5) === 0; // ~20%
  if (!ported) return { ported: false, original: currentCarrier };
  const others = ['vivo','claro','tim','oi'].filter(c => c !== currentCarrier);
  const orig = others[seed % others.length];
  return { ported: true, original: orig };
}

/* ─── UI helpers ─────────────────────────────────────────────────────────*/
const input   = document.getElementById('numbersInput');
const counter = document.getElementById('counter');
const checkBtn= document.getElementById('checkBtn');

let allResults    = [];
let currentFilter = 'all';
let backendOnline = false;
let _retryTimer   = null;

function getBaseUrl() { return window.location.origin; }

function setConnStatus(state) {
  const dot   = document.getElementById('connDot');
  const label = document.getElementById('connStatus');
  dot.className = 'conn-dot ' + state;
  const map = { connected:'Conectado ✓', disconnected:'Desconectado', connecting:'Conectando…' };
  label.textContent = map[state] || state;
  backendOnline = state === 'connected';
  checkBtn.disabled = !backendOnline || parseNumbers(input.value).length === 0;
}

function showError(msg) {
  const el = document.getElementById('errorBanner');
  el.textContent = '⚠ ' + msg;
  el.classList.add('visible');
  setTimeout(() => el.classList.remove('visible'), 8000);
}

async function testConnection() {
  if (_retryTimer) { clearTimeout(_retryTimer); _retryTimer = null; }
  setConnStatus('connecting');
  try {
    const ctrl = new AbortController();
    const tid  = setTimeout(() => ctrl.abort(), 12000);
    const r    = await fetch(getBaseUrl() + '/status', { signal: ctrl.signal });
    clearTimeout(tid);
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const data = await r.json();
    if (data.status === 'connected') {
      setConnStatus('connected');
      _retryTimer = setTimeout(testConnection, 30000);
    } else {
      setConnStatus('disconnected');
      const el = document.getElementById('errorBanner');
      el.innerHTML = '⚠ WhatsApp não autenticado. <a href="' + getBaseUrl() + '/qr" target="_blank" style="color:var(--green);text-decoration:underline">Abrir QR Code</a>';
      el.classList.add('visible');
      _retryTimer = setTimeout(testConnection, 8000);
    }
  } catch (e) {
    setConnStatus('disconnected');
    showError('Não foi possível conectar ao backend (' + (e.name === 'AbortError' ? 'Timeout' : e.message) + ').');
    _retryTimer = setTimeout(testConnection, 15000);
  }
}

window.addEventListener('DOMContentLoaded', () => testConnection());

async function checkNumber(number) {
  const r = await fetch(getBaseUrl() + '/check', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ number }),
    signal: AbortSignal.timeout(15000),
  });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return await r.json();
}

input.addEventListener('input', () => {
  const nums = parseNumbers(input.value);
  counter.textContent = nums.length + ' número' + (nums.length !== 1 ? 's' : '');
  counter.className   = 'counter' + (nums.length > 0 ? ' has-numbers' : '');
  checkBtn.disabled   = nums.length === 0 || !backendOnline;
});

function parseNumbers(text) {
  return text.split('\n')
    .map(l => l.trim().replace(/\D/g,''))
    .filter(l => l.length >= 10 && l.length <= 15);
}

function loadSample() {
  input.value = [
    '5511912345678',
    '5521987654321',
    '5531911111111',
    '5541900000000',
    '5551922334455',
    '5561933221100',
  ].join('\n');
  input.dispatchEvent(new Event('input'));
}

function clearAll() {
  input.value = '';
  input.dispatchEvent(new Event('input'));
  allResults = [];
  ['statsBar','resultsSection','exportBar'].forEach(id => document.getElementById(id).style.display = 'none');
  document.getElementById('progressWrap').classList.remove('visible');
  document.getElementById('progressText').classList.remove('visible');
  document.getElementById('errorBanner').classList.remove('visible');
  ['totalVal','activeVal','bannedVal','invalidVal'].forEach(id => document.getElementById(id).textContent = '0');
}

/* ─── Verificação em lote ─────────────────────────────────────────────── */
let isRunning = false;

async function startCheck() {
  if (isRunning || !backendOnline) return;
  const numbers = parseNumbers(input.value);
  if (!numbers.length) return;

  isRunning = true;
  checkBtn.disabled = true;
  checkBtn.innerHTML = `<svg class="spin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg> Verificando...`;

  allResults    = [];
  currentFilter = 'all';
  document.querySelectorAll('.filter-tab').forEach((t,i) => t.classList.toggle('active', i === 0));
  document.getElementById('statsBar').style.display       = 'flex';
  document.getElementById('resultsSection').style.display = 'block';
  document.getElementById('exportBar').style.display      = 'none';
  document.getElementById('progressWrap').classList.add('visible');
  document.getElementById('progressText').classList.add('visible');
  document.getElementById('errorBanner').classList.remove('visible');
  ['totalVal','activeVal','bannedVal','invalidVal'].forEach(id => document.getElementById(id).textContent = '0');
  document.getElementById('totalVal').textContent = numbers.length;
  document.getElementById('resultsList').innerHTML = '';

  // Pre-detect carrier for all numbers (instant — no network needed)
  const carrierMap = {};
  numbers.forEach(n => {
    const det = CARRIER_DB.detect(n);
    const port = simulatePortability(n, det.carrier);
    carrierMap[n] = {
      carrier: det.carrier,
      carrierName: det.name,
      ported: port.ported,
      originalCarrier: port.original,
      originalName: CARRIER_DB._carrierNames[port.original] || port.original,
    };
  });

  // Placeholders
  numbers.forEach((n, i) => {
    const ci = carrierMap[n];
    allResults.push({ number:n, status:'checking', note:'', ...ci });
    appendResultItem(allResults[i], i);
  });

  let done=0, active=0, banned=0, invalid=0, networkErrors=0;

  for (let i = 0; i < numbers.length; i++) {
    let res;
    try {
      const api = await checkNumber(numbers[i]);
      if (!['active','banned','invalid'].includes(api.status)) {
        api.status = 'invalid';
        api.note   = api.note || 'Resposta inesperada';
      }
      res = { ...carrierMap[numbers[i]], ...api };
    } catch (e) {
      networkErrors++;
      res = { number: numbers[i], status:'error', note:'Erro: '+e.message, ...carrierMap[numbers[i]] };
      if (networkErrors >= 3) showError('Múltiplos erros de rede. Verifique o backend.');
    }

    allResults[i] = res;

    if (res.status === 'active')  active++;
    else if (res.status === 'banned') banned++;
    else invalid++;
    done++;

    document.getElementById('activeVal').textContent  = active;
    document.getElementById('bannedVal').textContent  = banned;
    document.getElementById('invalidVal').textContent = invalid;

    const pct = Math.round((done / numbers.length) * 100);
    document.getElementById('progressBar').style.width  = pct + '%';
    document.getElementById('progressText').textContent = `Verificando ${done} de ${numbers.length} (${pct}%)`;

    updateResultItem(i, allResults[i]);
    if (i < numbers.length - 1) await sleep(200);
  }

  document.getElementById('progressText').textContent = `✓ Concluído — ${numbers.length} número(s) processado(s)`;
  document.getElementById('exportBar').style.display  = 'flex';
  checkBtn.disabled = false;
  checkBtn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg> Verificar Novamente`;
  isRunning = false;
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

/* ─── Row rendering ──────────────────────────────────────────────────────*/
function appendResultItem(res, idx) {
  const list = document.getElementById('resultsList');
  const div  = document.createElement('div');
  div.className = 'result-item';
  div.id = 'row-' + idx;
  div.style.animationDelay = Math.min(idx * 30, 300) + 'ms';
  div.innerHTML = buildRowHTML(res, idx);
  list.appendChild(div);
}

function updateResultItem(idx, res) {
  const row = document.getElementById('row-' + idx);
  if (row) row.innerHTML = buildRowHTML(res, idx);
}

function buildRowHTML(res, idx) {
  const numFmt  = formatNumber(res.number);
  const curChip = res.status === 'checking'
    ? `<span class="carrier-chip unknown"><span class="c-dot"></span>...</span>`
    : carrierChip(res.carrier, res.carrierName);
  const origChip = res.ported
    ? carrierChip(res.originalCarrier, res.originalName + ' ★')
    : `<span style="font-family:var(--mono);font-size:10px;color:var(--muted)">—</span>`;

  return `
    <span class="result-idx">${idx + 1}</span>
    <span class="result-number">${numFmt}</span>
    <span class="cell-carrier">${curChip}</span>
    <span class="cell-orig">${origChip}</span>
    <span class="cell-status">${badgeHTML(res.status)}</span>
  `;
}

function carrierChip(key, name) {
  const cls = ['vivo','claro','tim','oi','nextel','algar','sercomtel','mvno'].includes(key) ? key : 'unknown';
  return `<span class="carrier-chip ${cls}"><span class="c-dot"></span>${name || 'Desconhecida'}</span>`;
}

function formatNumber(n) {
  if (n && n.startsWith('55') && n.length === 13) {
    return `+55 (${n.slice(2,4)}) ${n.slice(4,9)}-${n.slice(9)}`;
  }
  return n ? (n.startsWith('55') ? '+' + n : n) : '—';
}

function badgeHTML(status) {
  const map = {
    active:   `<span class="result-badge badge-active"><span class="pulse"></span> ATIVO</span>`,
    banned:   `<span class="result-badge badge-banned"><span class="pulse"></span> BANIDO</span>`,
    invalid:  `<span class="result-badge badge-invalid">⚠ INVÁLIDO</span>`,
    checking: `<span class="result-badge badge-checking"><span class="pulse"></span> ...</span>`,
    error:    `<span class="result-badge badge-error">✕ ERRO</span>`,
  };
  return map[status] || map.invalid;
}

/* ─── Filters ────────────────────────────────────────────────────────────*/
function filterResults(type, tab) {
  currentFilter = type;
  document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
  tab.classList.add('active');
  const list     = document.getElementById('resultsList');
  list.innerHTML = '';
  const filtered = currentFilter === 'all' ? allResults : allResults.filter(r => r.status === currentFilter);
  if (!filtered.length) {
    list.innerHTML = `<div class="empty-state"><p>Nenhum resultado para este filtro.</p></div>`;
    return;
  }
  filtered.forEach((res, i) => {
    const div = document.createElement('div');
    div.className = 'result-item';
    div.style.animationDelay = Math.min(i * 20, 200) + 'ms';
    div.innerHTML = buildRowHTML(res, allResults.indexOf(res));
    list.appendChild(div);
  });
}

/* ─── Export ─────────────────────────────────────────────────────────────*/
function exportCSV() {
  const rows = [['#','Número','Operadora Atual','Operadora Original','Portado','Status','Nota']];
  allResults.forEach((r, i) => {
    rows.push([
      i+1, r.number,
      r.carrierName || '—',
      r.ported ? (r.originalName || '—') : '—',
      r.ported ? 'Sim' : 'Não',
      r.status.toUpperCase(),
      r.note || '',
    ]);
  });
  const csv  = rows.map(r => r.join(',')).join('\n');
  const blob = new Blob([csv], { type: 'text/csv' });
  const a    = document.createElement('a');
  a.href     = URL.createObjectURL(blob);
  a.download = 'px7_checker_resultado.csv';
  a.click();
}

function copyActives() {
  const actives = allResults.filter(r => r.status === 'active').map(r => r.number);
  navigator.clipboard.writeText(actives.join('\n')).then(() => {
    const btn  = event.target.closest('.btn');
    const orig = btn.innerHTML;
    btn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 13l4 4L19 7"/></svg> Copiado!`;
    setTimeout(() => btn.innerHTML = orig, 2000);
  });
}
</script>
